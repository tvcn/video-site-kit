  :root {

    --bg: #0d100f;
    --surface: #151918;

    --muted: #a59c90;
    --line: rgba(243, 239, 231, .16);

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 28px;
    background:

    line-height: 1.65;

    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 54px;
    color: var(--ink);
    text-decoration: none;
  }
  .mark {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: #171513;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-weight: 700;
    letter-spacing: -.06em;
  }
  .mark::after { content: ""; width: 5px; height: 5px; margin-left: 2px; border-radius: 50%; background: var(--accent); }
  .brand strong { display: block; font-size: 18px; letter-spacing: .04em; line-height: 1.1; }
  .brand small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
  .eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .2em; }

  .lead { max-width: 560px; color: var(--muted); font-size: 17px; }
  .lead strong { color: var(--ink); font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .actions a {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 46px; padding: 0 18px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); text-decoration: none; font-size: 14px;
  }
  .actions a:first-child { background: var(--accent); color: #17120e; border-color: var(--accent); font-weight: 600; }
  .actions a:hover { border-color: var(--ink); }
  .hint { margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .path { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-all; }
  @media (max-width: 520px) {
    .brand { margin-bottom: 38px; }
